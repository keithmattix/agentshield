syntax = "proto3";

package agentshield.classification.v1;

option go_package = "github.com/agentshield-dev/agentshield/pkg/classification";

message Resource {
  string kind = 1;
  string name = 2;
  string namespace = 3;
  Metadata metadata = 4;
}

message Metadata {
  map<string, string> labels = 1;
  map<string, string> annotations = 2;
  map<string, string> tags = 3;
}
